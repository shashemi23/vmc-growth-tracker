name: Update data and deploy

on:
  push:
    branches: [main]
  schedule:
    # Mondays 11:00 UTC (6-7am Toronto). CMHC publishes monthly; York Region updates continuously.
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Fetch fresh data before building"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Secrets can't be read in `if:`; expose only whether the key exists.
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        if: github.event_name == 'schedule' || inputs.refresh_data
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        if: github.event_name == 'schedule' || inputs.refresh_data
        run: pip install -r requirements.txt

      - name: Fetch data
        if: github.event_name == 'schedule' || inputs.refresh_data
        run: |
          python pipeline/fetch_devapps.py
          python pipeline/fetch_cmhc.py
          python pipeline/fetch_trreb.py
          python pipeline/fetch_boc.py

      - name: Generate plain-language summary (Claude)
        if: (github.event_name == 'schedule' || inputs.refresh_data) && env.HAS_ANTHROPIC_KEY == 'true'
        # A failed or declined generation keeps last week's summary instead of failing the deploy.
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline/generate_summary.py

      - name: Commit data changes
        if: github.event_name == 'schedule' || inputs.refresh_data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: weekly refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
